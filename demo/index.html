<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landing page rebuild demo</title><link rel="stylesheet" href="styles.css"></head>
<body><i class="blob b1"></i><i class="blob b2"></i><div class="wrap" id="root"></div>
<script src="site.js"></script>
<script>
(function(){
  var S=window.SITE, r=document.documentElement.style;
  r.setProperty("--accent",S.accent);r.setProperty("--accent2",S.accent2);r.setProperty("--ink",S.ink);r.setProperty("--soft",S.soft);
  var e=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
  var mark=function(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 32 32"><path d="M2 12 14 4v22L2 20z" fill="'+S.accent2+'"/><path d="M17 8l13-6v18l-13 8z" fill="'+S.accent+'"/></svg>'};
  var st=function(d,c){return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>'};
  var ics=['<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>','<circle cx="12" cy="12" r="9" fill="'+"currentColor"+'" stroke="none"/><path d="M8 12.5l3 3 5-6" stroke="#fff"/>','<path d="M6 20V12M12 20V6M18 20v-9" stroke-width="3"/>'];
  var mi=['<path d="M4 11l8-7 8 7v9H4z"/>','<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>','<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>','<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-4 4-5.5 6.5-5.5S14.500 16 15.500 20M16 5a3.500 3.500 0 010 6.500M18 15c2 .6 3.500 2 4 5"/>','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'];
  var mini=function(d,c){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>'};
  var A=S.app, arrow='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var panel=function(p){return '<div class="panel"><div class="ph"><span>'+e(p.title)+'</span><a>'+e(S.app.viewAll)+' →</a></div><div class="row"><i>'+mini(mi[1],S.accent)+'</i><div><b>'+e(p.row)+'</b><span>'+e(p.meta)+'</span></div></div></div>'};
  document.getElementById("root").innerHTML=
   '<header class="nav"><div class="brand">'+mark(40)+e(S.brand)+'</div><nav class="links">'+S.nav.map(function(n){return"<span>"+e(n)+"</span>"}).join("")+'</nav><a class="btn">'+e(S.navCta)+'</a></header>'+
   '<section class="hero"><span class="badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 3l1.800 5.200L17 10l-5.200 1.800L10 17l-1.800-5.200L3 10l5.200-1.800zM18 14l.9 2.100L21 17l-2.100.9L18 20l-.9-2.100L15 17l2.100-.9z"/></svg>'+e(S.badge)+'</span>'+
   '<h1>'+e(S.title[0])+'<br>'+e(S.title[1])+'</h1><p class="sub">'+e(S.sub)+'</p><div class="cta"><a class="btn p">'+e(S.primary)+'</a><a class="btn o">'+e(S.secondary)+'</a></div></section>'+
   '<section class="app"><aside class="side"><div class="brand">'+mark(28)+e(S.brand)+'</div>'+A.menu.map(function(m,i){return'<a class="'+(i?'':'on')+'">'+mini(mi[i],i?"#6a6e86":S.accent)+e(m)+'</a>'}).join("")+'</aside>'+
   '<div class="main"><div class="top"><div><h3>'+e(A.title)+'</h3><small>'+e(A.sub)+'</small></div><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8ea6" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'+e(A.search)+'</div><div class="av">'+e(A.user)+'</div></div>'+
   '<div class="cards">'+A.cards.map(function(c,i){return'<div class="card" style="background:'+c.bg+'"><div class="ico" style="color:'+c.ic+'">'+st(ics[i],c.ic)+'</div><div class="l">'+e(c.label)+'</div><div class="v">'+e(c.value)+'</div><div class="f"><span>'+e(c.foot)+'</span>'+arrow+'</div></div>'}).join("")+'</div>'+
   '<div class="two">'+panel(A.left)+panel(A.right)+'</div></div></section>';
})();
</script></body></html>
