<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landing Page Starter</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav"><div class="wrap nav-in">
  <a class="brand" href="#"><span class="logo" id="logo"></span><span id="brandName"></span></a>
  <nav id="navLinks"></nav>
  <a class="btn btn-sm" id="navCta"></a>
</div></header>

<main>
  <section class="hero"><div class="wrap">
    <span class="badge" id="badge"></span>
    <h1 id="heroTitle"></h1>
    <p class="sub" id="heroSub"></p>
    <div class="actions"><a class="btn" id="heroPrimary"></a><a class="btn btn-ghost" id="heroSecondary"></a></div>
    <p class="note" id="heroNote"></p>
    <div class="mock" aria-hidden="true">
      <div class="mock-bar"><i></i><i></i><i></i></div>
      <div class="mock-body"><div class="l w60"></div><div class="l w90"></div><div class="l w40"></div><div class="chips"><b></b><b></b><b></b></div></div>
    </div>
  </div></section>

  <section class="logos"><div class="wrap"><p>已被这些团队采用</p><div id="logos"></div></div></section>
  <section id="features"><div class="wrap"><div class="grid3" id="features-grid"></div></div></section>
  <section class="stats"><div class="wrap"><div class="grid3" id="stats"></div></div></section>
  <section><div class="wrap"><blockquote id="quote"></blockquote></div></section>
  <section id="pricing"><div class="wrap"><h2>简单透明的价格</h2><div class="grid3" id="pricing-grid"></div></div></section>
  <section id="faq"><div class="wrap narrow"><h2>常见问题</h2><div id="faq-list"></div></div></section>
  <section class="final"><div class="wrap"><h2>今天就让会议产出行动</h2><a class="btn" id="finalCta"></a></div></section>
</main>
<footer><div class="wrap" id="footer"></div></footer>

<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
